<section data-cy="orders-page" class="space-y-6">
  <div class="space-y-2">
    <div class="flex flex-wrap items-center gap-3">
      <h1 class="text-2xl font-semibold text-foreground">{{ heading }}</h1>
      <span class="rounded-full bg-amber-100 px-3 py-1 text-xs font-semibold text-amber-900">
        {{ totalOrders }} {{ totalOrders === 1 ? 'order' : 'orders' }}
      </span>
    </div>

    <p class="max-w-2xl text-sm text-muted">
      {{ description }}
    </p>
  </div>

  <app-card className="space-y-4 p-6">
    @if (loading) {
      <p data-cy="orders-loading" class="text-sm text-muted">Loading orders...</p>
    } @else if (errorMessage) {
      <div
        data-cy="orders-error"
        class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-900"
      >
        {{ errorMessage }}
      </div>
    } @else if (rows.length === 0) {
      <div
        data-cy="orders-empty"
        class="rounded-xl border border-dashed border-border bg-amber-50/50 px-4 py-8 text-center text-sm text-muted"
      >
        No orders found yet.
      </div>
    } @else {
      <app-table dataCy="orders-table" [columns]="columns" [rows]="rows" />
    }
  </app-card>
</section>
