<div data-cy="register-page" class="mx-auto max-w-md py-12">
  <app-card>
    <h1 class="text-2xl font-semibold text-foreground">Create account</h1>
    <p class="mt-1 text-sm text-muted">Register to purchase coffee and access order history.</p>

    <form data-cy="register-form" class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <app-form-field label="Username">
        <input
          data-cy="register-username"
          class="{{ controlClasses }}"
          type="text"
          formControlName="username"
        />
      </app-form-field>

      <app-form-field label="Email">
        <input data-cy="register-email" class="{{ controlClasses }}" type="email" formControlName="email" />
      </app-form-field>

      <app-form-field label="Password">
        <input data-cy="register-password" class="{{ controlClasses }}" type="password" formControlName="password" />
      </app-form-field>

      <app-button type="submit" className="w-full" dataCy="register-submit">Register</app-button>
    </form>

    <p class="mt-4 text-sm text-muted">
      Already registered?
      <a data-cy="register-login-link" routerLink="/login" class="font-medium text-primary hover:underline">Sign in</a>
    </p>
  </app-card>
</div>
