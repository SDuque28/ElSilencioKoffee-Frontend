<div data-cy="change-password-page" class="mx-auto max-w-2xl py-12 md:py-16">
  <app-card className="p-7 md:p-8">
    <div class="space-y-2">
      <h1 class="text-2xl font-semibold text-foreground">Change password</h1>
      <p class="max-w-xl text-sm leading-6 text-muted">
        Update your password for the current authenticated account.
      </p>
    </div>

    <form
      data-cy="change-password-form"
      class="mt-5"
      [formGroup]="form"
      (ngSubmit)="submit()"
    >
      <app-form-field label="Current password" [error]="errorFor('currentPassword')">
        <input
          data-cy="change-password-current-password"
          class="{{ controlClasses }}"
          type="password"
          formControlName="currentPassword"
          placeholder="Your current password"
        />
      </app-form-field>

      <div class="grid gap-6 md:grid-cols-2 mt-3">
        <app-form-field label="New password" [error]="errorFor('newPassword')">
          <input
            data-cy="change-password-new-password"
            class="{{ controlClasses }}"
            type="password"
            formControlName="newPassword"
            placeholder="Your new password"
          />
        </app-form-field>
        
        <app-form-field label="Confirm password" [error]="errorFor('confirmPassword')">
          <input
            data-cy="change-password-confirm-password"
            class="{{ controlClasses }}"
            type="password"
            formControlName="confirmPassword"
            placeholder="Confirm your new password"
          />
        </app-form-field>
      </div>

      <div class="grid gap-6 md:grid-cols-2 mt-4">
        <div class="space-y-2">
          @if (serverError()) {
          <p data-cy="change-password-error" class="text-sm text-danger">{{ serverError() }}</p>
        }

        <app-button
          type="submit"
          className="w-full"
          dataCy="change-password-submit"
          [disabled]="loading()"
        >
          {{ loading() ? 'Updating...' : 'Change password' }}
        </app-button>
        </div>
        
      </div>
    </form>

    <p class="mt-6 text-sm text-muted">
      <a
        data-cy="change-password-products-link"
        routerLink="/products"
        class="font-medium text-primary hover:underline"
      >
        Back to products
      </a>
    </p>
  </app-card>
</div>
