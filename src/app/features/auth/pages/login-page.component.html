<div data-cy="login-page" class="mx-auto max-w-md py-12">
  <app-card>
    <h1 class="text-2xl font-semibold text-foreground">Login</h1>
    <p class="mt-1 text-sm text-muted">Access your ecommerce and analytics workspace.</p>

    <form data-cy="login-form" class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <app-form-field label="Username">
        <input
          data-cy="login-username"
          class="{{ controlClasses }}"
          type="text"
          formControlName="username"
        />
      </app-form-field>

      <app-form-field label="Password">
        <input data-cy="login-password" class="{{ controlClasses }}" type="password" formControlName="password" />
      </app-form-field>

      <app-button type="submit" className="w-full" dataCy="login-submit">Sign In</app-button>
    </form>

    <p class="mt-4 text-sm text-muted">
      No account yet?
      <a data-cy="login-register-link" routerLink="/register" class="font-medium text-primary hover:underline">Create one</a>
    </p>
  </app-card>
</div>
