<div
  [attr.data-cy]="dataCy"
  class="overflow-hidden rounded-xl border"
  [class.border-border]="theme === 'default'"
  [class.bg-white]="theme === 'default'"
  [class.border-[#2a2a2e]]="theme === 'admin'"
  [class.bg-[#121214]]="theme === 'admin'"
>
  <div class="overflow-x-auto">
    <table class="min-w-full text-left text-sm">
      <thead [class.bg-amber-50]="theme === 'default'" [class.bg-[#1b1b1f]]="theme === 'admin'">
        <tr>
          @for (column of columns; track column.key) {
            <th
              class="px-4 py-3 font-semibold"
              [class.text-foreground]="theme === 'default'"
              [class.text-[#f3f4f6]]="theme === 'admin'"
            >
              {{ column.label }}
            </th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of rows; track $index) {
          @let rowLink = getRowLink(row);
          <tr
            [attr.data-cy]="getRowDataCy(row)"
            [attr.role]="rowLink ? 'link' : null"
            [attr.tabindex]="rowLink ? 0 : null"
            [class.border-t]="true"
            [class.border-border]="theme === 'default'"
            [class.border-[#2a2a2e]]="theme === 'admin'"
            [class.cursor-pointer]="!!rowLink"
            [class.hover:bg-amber-50/40]="theme === 'default' && !!rowLink"
            [class.hover:bg-[#1b1b1f]]="theme === 'admin' && !!rowLink"
            [class.focus-visible:outline-none]="!!rowLink"
            [class.focus-visible:ring-2]="!!rowLink"
            [class.focus-visible:ring-[#b45f1e]/30]="!!rowLink"
            (click)="onRowClick(row)"
            (keydown)="onRowKeydown($event, row)"
          >
            @for (column of columns; track column.key) {
              <td
                class="px-4 py-3"
                [class.text-muted]="theme === 'default'"
                [class.text-[#9ca3af]]="theme === 'admin'"
              >
                @if (toLinkCell(row[column.key]); as linkCell) {
                  <a
                    [routerLink]="linkCell.routerLink"
                    [attr.data-cy]="linkCell.dataCy ?? null"
                    class="font-semibold text-[#b45f1e] underline-offset-4 hover:underline"
                  >
                    {{ linkCell.label }}
                  </a>
                } @else {
                  {{ row[column.key] }}
                }
              </td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
